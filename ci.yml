name: CI — AI Service

# AI-Service repo contains two buildable components:
#   - node-service/     (Node.js orchestrator)
#   - python-sidecar/   (FastAPI + MediaPipe + Groq)
# Both are built in parallel and pushed as separate images.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Build Node.js AI orchestrator ───────────────────────────
  build-node-service:
    name: Build node-service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/node-service
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./node-service
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dispatch to orchestrator
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ORCHESTRATOR_PAT }}
          repository: ${{ github.repository_owner }}/stylesense-orchestrator
          event-type: service-updated
          client-payload: |
            {
              "service": "node-service",
              "image": "ghcr.io/${{ github.repository_owner }}/node-service",
              "tag": "${{ steps.meta.outputs.version }}",
              "sha": "${{ github.sha }}",
              "actor": "${{ github.actor }}"
            }

  # ── Build Python sidecar (MediaPipe + FastAPI + Groq) ───────
  build-python-sidecar:
    name: Build python-sidecar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/python-sidecar
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Python sidecar is large (TensorFlow + MediaPipe ~1.5GB).
      # Buildx layer cache makes repeat builds ~3min instead of ~12min.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./python-sidecar
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dispatch to orchestrator
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ORCHESTRATOR_PAT }}
          repository: ${{ github.repository_owner }}/stylesense-orchestrator
          event-type: service-updated
          client-payload: |
            {
              "service": "python-sidecar",
              "image": "ghcr.io/${{ github.repository_owner }}/python-sidecar",
              "tag": "${{ steps.meta.outputs.version }}",
              "sha": "${{ github.sha }}",
              "actor": "${{ github.actor }}"
            }
