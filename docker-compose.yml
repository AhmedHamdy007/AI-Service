services:
  node-service:
    build:
      context: ./node-service
    container_name: ai-node-service
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      PYTHON_SIDECAR_URL: http://python-sidecar:8001
      DISABLE_LLM: ${DISABLE_LLM:-false}
    depends_on:
      - python-sidecar
    restart: unless-stopped
    networks:
      ai-net:
        aliases:
          - ai-service
          - node-service

  python-sidecar:
    build:
      context: ./python-sidecar
    container_name: python-sidecar
    ports:
      - "8001:8001"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
    volumes: []
    restart: unless-stopped
    networks:
      - ai-net

networks:
  ai-net:
    driver: bridge
